# ===============================================================
# It's recommended to use Alternate Theme Config to configure NexT
# Modifying this file may result in merge conflict
# See: https://theme-next.js.org/docs/getting-started/configuration
# ===============================================================

# ---------------------------------------------------------------
# Theme Core Configuration Settings
# ---------------------------------------------------------------
cache:
  enable: true

minify: false

custom_file_path:
  #head: source/_data/head.njk
  #header: source/_data/header.njk
  #sidebar: source/_data/sidebar.njk
  #postMeta: source/_data/post-meta.njk
  #postBodyStart: source/_data/post-body-start.njk
  #postBodyEnd: source/_data/post-body-end.njk
  #footer: source/_data/footer.njk
  #bodyEnd: source/_data/body-end.njk
  #variable: source/_data/variables.styl
  #mixin: source/_data/mixins.styl
  #style: source/_data/styles.styl


# ---------------------------------------------------------------
# Scheme Settings
# ---------------------------------------------------------------
scheme: Gemini
darkmode: true

lightdark:
  enable: false
  check_supports: true


# ---------------------------------------------------------------
# Site Information Settings
# ---------------------------------------------------------------
favicon:
  small: /images/favicon-16x16-next.png
  medium: /images/favicon-32x32-next.png
  apple_touch_icon: /images/apple-touch-icon-next.png
  safari_pinned_tab: /images/logo.svg

custom_logo:

creative_commons:
  license: by-nc-sa
  size: small
  sidebar: true
  post: false
  language:

open_graph:
  enable: true
  options:
    #twitter_card: <twitter:card>
    #twitter_id: <twitter:creator>
    #twitter_site: <twitter:site>
    #twitter_image: <twitter:image>
    #fb_admins: <fb:admin_id>
    #fb_app_id: <fb:app_id>


# ---------------------------------------------------------------
# Menu Settings
# ---------------------------------------------------------------
menu:
  home: / || fa fa-home
  #tags: /tags/ || fa fa-tags
  #categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  about: /about/ || fa fa-user
  #schedule: /schedule/ || fa fa-calendar
  #sitemap: /sitemap.xml || fa fa-sitemap
  #commonweal: /404/ || fa fa-heartbeat

menu_settings:
  icons: true
  badges: false


# ---------------------------------------------------------------
# Sidebar Settings
# ---------------------------------------------------------------
sidebar:
  position: left
  width_expanded: 320
  width_dual_column: 240
  display: post
  padding: 18
  offset: 12

# Avatar (Menggunakan bentuk bulat sesuai permintaan)
avatar:
  url: /images/avatar.png
  rounded: true
  rotated: false

site_state: true

social:
  GitHub: https://github.com/wildanfq || fab fa-github
  Twitter: https://twitter.com/wldnfq || fab fa-twitter
  YouTube: https://youtube.com/wildanfq || fab fa-youtube
  Mastodon: https://mastodon.social/@wldnfq || fab fa-mastodon

social_icons:
  enable: true
  icons_only: true
  transition: false

links_settings:
  icon: fa fa-globe
  layout: block

links:
  #Title: https://example.com

toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 6


# ---------------------------------------------------------------
# Footer Settings
# ---------------------------------------------------------------
language_switcher: false

footer:
  #since: 2021
  icon:
    name: fa fa-heart
    animated: false
    color: "#ff0000"
  copyright:
  powered: false
  beian:
    enable: false
    icp:
    gongan_id:
    gongan_num:
    gongan_icon_url:


# ---------------------------------------------------------------
# Post Settings
# ---------------------------------------------------------------
excerpt_description: true
read_more_btn: true

# Post meta display settings
post_meta:
  item_text: false   
  created_at: true
  updated_at: true
  categories: true
  tags: true

# Post wordcount display settings
symbols_count_time:
  separated_meta: false   
  item_text_total: false

tag_icon: true

reward_settings:
  enable: false
  animation: false

reward:
  #wechatpay: /images/wechatpay.png
  #alipay: /images/alipay.png
  #paypal: /images/paypal.png
  #bitcoin: /images/bitcoin.png

follow_me:
  #Twitter: https://twitter.com/username || fab fa-twitter
  #Telegram: https://t.me/channel_name || fab fa-telegram
  #WeChat: /images/wechat_channel.png || fab fa-weixin
  #RSS: /atom.xml || fa fa-rss

related_posts:
  enable: false
  icon: fa fa-signs-post

post_edit:
  enable: false
  url: https://github.com/user-name/repo-name/tree/branch-name/subdirectory-name/

post_navigation: left


# ---------------------------------------------------------------
# Custom Page Settings
# ---------------------------------------------------------------
tagcloud:
  min: 12
  max: 30
  amount: 200
  orderby: name
  order: 1

calendar:
  calendar_id: <required>
  api_key: <required>
  orderBy: startTime
  showLocation: false
  offsetMax: 72
  offsetMin: 4
  showDeleted: false
  singleEvents: true
  maxResults: 250


# ---------------------------------------------------------------
# Misc Theme Settings
# ---------------------------------------------------------------
preconnect: false

text_align:
  desktop: justify
  mobile: justify

mobile_layout_economy: false

theme_color:
  light: "#222"
  dark: "#222"

body_scrollbar:
  overlay: false

codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  prism:
    light: prism
    dark: prism-dark
  copy_button:
    enable: true
    style: flat
  fold:
    enable: false
    height: 500
  language: true

back2top:
  enable: true
  sidebar: false
  scrollpercent: false

reading_progress:
  enable: false
  start_at: left
  position: top
  reversed: false
  color: "#37c6c0"
  height: 3px

bookmark:
  enable: false
  color: "#222"
  save: auto

github_banner:
  enable: false
  permalink: https://github.com/yourname


# ---------------------------------------------------------------
# Font Settings (Menggunakan Default sesuai permintaan)
# ---------------------------------------------------------------
font:
  enable: false
  host:
  global:
    external: true
    family: Lato
    size:
  title:
    external: true
    family:
    size:
  headings:
    external: true
    family:
    size:
  posts:
    external: true
    family:
  codes:
    external: true
    family:


# ---------------------------------------------------------------
# SEO Settings
# ---------------------------------------------------------------
index_with_subtitle: false
exturl: false
exturl_icon: true

google_site_verification:
bing_site_verification:
yandex_site_verification:
baidu_site_verification:


# ---------------------------------------------------------------
# Tags Settings
# ---------------------------------------------------------------
note:
  style: simple
  icons: false
  light_bg_offset: 0

tabs:
  sticky: false
  transition:
    tabs: false
    labels: true

pdf:
  enable: false
  height: 500px

mermaid:
  enable: false
  theme:
    light: default
    dark: dark

wavedrom:
  enable: false


# ---------------------------------------------------------------
# Math Formulas Render Support
# ---------------------------------------------------------------
math:
  every_page: false
  mathjax:
    enable: false
    tags: none
    display_overflow: scroll
  katex:
    enable: false
    copy_tex: false


# ---------------------------------------------------------------
# External Libraries
# ---------------------------------------------------------------
pjax: true
fancybox: false
mediumzoom: false
pangu: false

quicklink:
  enable: false
  home: false
  archive: false
  delay: true
  timeout: 3000
  priority: true


# ---------------------------------------------------------------
# Animation Settings
# ---------------------------------------------------------------
motion:
  enable: true
  async: false
  duration: 200
  transition:
    menu_item: fadeInDown
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    sidebar: fadeInUp

pace:
  enable: false
  color: blue
  theme: minimal

canvas_ribbon:
  enable: false
  size: 300
  alpha: 0.6
  zIndex: -1


# ---------------------------------------------------------------
# Comments Settings
# ---------------------------------------------------------------
comments:
  style: tabs
  active:
  storage: true
  lazyload: false
  nav:
    #disqus:
    #  text: Load Disqus
    #  order: -1
    #gitalk:
    #  order: -2

disqus:
  enable: false
  shortname:
  count: true

disqusjs:
  enable: false
  api:
  apikey:
  shortname:

livere_uid:

gitalk:
  enable: false
  github_id:
  repo:
  client_id:
  client_secret:
  admin_user:
  distraction_free_mode: true
  proxy: https://cors-anywhere.azm.workers.dev/https://github.com/login/oauth/access_token
  language:
  body:

utterances:
  enable: false
  repo: user-name/repo-name
  issue_term: pathname
  theme: github-light

isso:


# ---------------------------------------------------------------
# Post Widgets & Content Sharing Services
# ---------------------------------------------------------------
addtoany:
  enable: false
  buttons:


# ---------------------------------------------------------------
# Statistics and Analytics
# ---------------------------------------------------------------
google_analytics:
  tracking_id:
  only_pageview: false
  measure_protocol_api_secret:

baidu_analytics:
cloudflare_analytics:
clarity_analytics:

matomo:
  enable: false
  server_url:
  site_id:

umami:
  enable: false
  script_url:
  website_id:
  host_url:

plausible:
  enable: false
  script_url:
  site_domain:

firestore:
  enable: false
  collection: articles
  projectId:

busuanzi_count:
  enable: false
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye


# ---------------------------------------------------------------
# Search Services
# ---------------------------------------------------------------
algolia_search:
  enable: false
  hits:
    per_page: 10

local_search:
  enable: true
  top_n_per_article: 1
  unescape: false
  preload: false


# ---------------------------------------------------------------
# Chat Services
# ---------------------------------------------------------------
chat:
  enable: false
  icon: fa fa-comment

chatra:
  enable: false
  async: true
  id:

tidio:
  enable: false
  key:

knocket:
  enable: false
  async: true
  identifier:


# ---------------------------------------------------------------
# CDN Settings
# ---------------------------------------------------------------
vendors:
  internal: local
  plugins: cdnjs
  custom_cdn_url:

css: css
js: js
images: images